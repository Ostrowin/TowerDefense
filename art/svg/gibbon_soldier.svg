  <g transform="rotate(-6 104 116)" stroke-linecap="round">
    <path d="M97 106 L111 106 M97 112 L111 112 M97 118 L111 118" stroke="#5ff3ff" stroke-width="2"/>
    <path d="M98 100 L110 100" stroke="#6f8a90" stroke-width="1.5"/>
