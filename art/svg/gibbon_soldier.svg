    <!-- kamizelka -->
    <path d="M54 76 C62 68 78 68 85 76 C88 88 86 100 80 108 L58 108 C54 100 52 88 54 76 Z" fill="#2f4a4f"/>
  </g>
  <circle cx="47" cy="72" r="2.5" fill="#5ff3ff" opacity="0.8"/>
