    <!-- dalsza ręka -->
    <path d="M58 70 C42 80 32 100 30 124 L40 126 C42 104 50 88 64 80 Z" fill="#8f7a5c"/>
    <circle cx="35" cy="129" r="7" fill="#2a221c"/>
