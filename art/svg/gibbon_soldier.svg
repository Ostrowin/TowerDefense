  <circle cx="38" cy="45" r="2.5" fill="#5ff3ff" stroke="#1a120c" stroke-width="1"/>
  <!-- pas drużyny, lamówka, rdzeń -->
  <path d="M65 70 L72 70 L72 108 L65 108 Z" fill="#d000d0"/>
  <path d="M65 70 L65 108" stroke="#ff00ff" stroke-width="1"/>
  <path d="M54 77 C62 69 78 69 85 77" fill="none" stroke="#b8893a" stroke-width="2"/>
  <path d="M58 107 L80 107" stroke="#b8893a" stroke-width="2"/>
